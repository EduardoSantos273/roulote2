<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roulote</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container" id="mainScreen">
        <div class="left">

            <input type="text" id="clientName" class="big-input" placeholder="Nome do Cliente">

            <div id="specialButtons">
                <button class="big-btn" onclick="selectSpecial('B')">B</button>
                <button class="big-btn" onclick="selectSpecial('H')">H</button>
                <button class="big-btn" onclick="selectSpecial('E')">E</button>
                <button class="big-btn" onclick="selectSpecial('C')">C</button>
            </div>

            <div id="products">
                <button class="product-btn" onclick="addProduct('Simples', 3)">Simples<br>3€</button>
                <button class="product-btn" onclick="addProduct('Queijo', 3.50)">Queijo<br>3,50€</button>
                <button class="product-btn" onclick="addProduct('Q/Bacon', 3.70)">Q/Bacon<br>3,70€</button>
                <button class="product-btn" onclick="addProduct('Especial', 4)">Especial<br>4€</button>
                <button class="product-btn" onclick="addProduct('Entremeada', 3.50)">Entremeada<br>3,50€</button>
                <button class="product-btn" onclick="addProduct('Veg', 2)">Veg<br>2€</button>
                <button class="product-btn" onclick="addProduct('Agua', 1)">Água<br>1€</button>
                <button class="product-btn" onclick="addProduct('Mini', 1.20)">Mini<br>1,20€</button>
                <button class="product-btn" onclick="addProduct('Latas', 1.50)">Latas<br>1,50€</button>
                <button class="product-btn" onclick="addProduct('Café', 0.5)">Café<br>0,50€</button>
            </div>
        </div>

        <div class="right">
            <div id="currentOrder">
                <h2>Pedido Atual</h2>
                <ul id="orderList"></ul>
                <p class="total">Total: <span id="orderTotal">0</span>€</p>

                <button class="action-btn green" onclick="addClient()">Adicionar Cliente</button>
                <button class="action-btn red" onclick="clearOrder()">Limpar Pedido</button>
            </div>

            <button class="action-btn blue" onclick="showClients()">Ver Clientes</button>
        </div>
    </div>

    <div class="clients-screen" id="clientsScreen" style="display:none;">
        <button class="action-btn blue" onclick="backToMain()">Voltar</button>
        <div id="clients"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
